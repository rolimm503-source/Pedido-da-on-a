<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedido de Namoro</title>
    <link rel="stylesheet" href="stile.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="heart-group">
          <span>💖</span>
          <span>💞</span>
          <span>💗</span>
        </div>

        <p class="label">Para você</p>
        <h1>Você aceita namorar comigo?</h1>

        <p class="message">
          Eu sei que isso é muito importante para mim, mas você é a pessoa que
          faz meu coração bater mais forte todos os dias.
        </p>

        <div class="buttons">
          <button class="btn yes">Sim</button>
          <button class="btn no" id="noButton">Não</button>
        </div>

        <div class="hidden-message" id="hiddenMessage">
          <h2>Yesss! ❤️</h2>
          <p>Você acabou de me fazer o mais feliz do mundo.</p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
